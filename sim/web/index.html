<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ZecTrix 模拟器</title>
<style>
  body { font-family: system-ui, sans-serif; background: #e9e6df; margin: 0; padding: 24px; color: #222; }
  .wrap { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
  .device { background: #f7f5ef; border-radius: 18px; padding: 22px; box-shadow: 0 4px 18px #0003; }
  .screen { display: block; width: 800px; height: 600px; image-rendering: pixelated; background: #fff;
            border: 10px solid #1d1d1d; border-radius: 6px; }
  .buttons { display: flex; justify-content: center; gap: 18px; margin-top: 18px; }
  .btn { width: 110px; padding: 14px 0; border-radius: 10px; border: 2px solid #444; background: #fff;
         font-size: 16px; cursor: pointer; user-select: none; touch-action: none; }
  .btn:active, .btn.down { background: #ffd600; }
  .btn.rec { background: #ff5252; }  /* microphone open (the device blinks its LED) */
  .btn small { display: block; font-size: 11px; color: #666; margin-top: 3px; }
  .side { min-width: 260px; max-width: 340px; }
  select, button.small { font-size: 14px; padding: 6px 10px; margin-right: 6px; }
  #log { font: 12px/1.6 ui-monospace, monospace; background: #fff; border: 1px solid #ccc; border-radius: 6px;
         padding: 8px; height: 260px; overflow: auto; white-space: pre-wrap; }
  .hint { font-size: 13px; color: #555; line-height: 1.6; }
  #err { color: #b00020; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<h2 style="margin-top:0">ZecTrix 墨水屏模拟器</h2>
<div class="wrap">
  <div class="device">
    <img id="screen" class="screen" alt="screen">
    <div class="buttons">
      <div class="btn" id="b-up">UP<small>↑</small></div>
      <div class="btn" id="b-down">DOWN<small>↓</small></div>
      <div class="btn" id="b-boot">BOOT<small>Enter / B</small></div>
    </div>
  </div>
  <div class="side">
    <p>当前页面：<b id="curpage">-</b>　<button class="small" id="reset">重启（回首页）</button></p>
    <p><label>调试：直接跳转 <select id="page"></select></label></p>
    <p class="hint">设备上传服务（固件真实的传图页面和接口）：<br>
       <a id="devlink" target="_blank">打开</a>　上传的照片会直接出现在相册里</p>
    <div id="err"></div>
    <p class="hint">
      单击：短按松开<br>
      长按：按住 ≥ 1000ms（与真机一致）。真机没有双击，所以这里也没有<br>
      同时按住 UP 和 DOWN 1 秒：配网（和真机一致）<br>
      长按 BOOT：从任何页面回到首页<br>
      键盘：↑ ↓ 对应 UP / DOWN，Enter 或 B 对应 BOOT，按住同样算长按
    </p>
    <div id="log"></div>
  </div>
</div>
<script>
const LONG_MS = 1000;  // kNavLongPressMs in the board file. The device has no double-click, so neither does this.
const pageSel = document.getElementById('page');
const img = document.getElementById('screen');
const log = document.getElementById('log');
const err = document.getElementById('err');
const curPage = document.getElementById('curpage');
let busy = Promise.resolve();
let count = 0;

// The device keeps its own state; every request must reach it exactly once and in order.
function send(path, label) {
  busy = busy.then(async () => {
    const r = await fetch(path + (path.includes('?') ? '&' : '?') + 't=' + Date.now());
    if (!r.ok) { err.textContent = await r.text(); return; }
    err.textContent = '';
    const blob = await r.blob();
    img.src = URL.createObjectURL(blob);
    shownPng = null;  // the next poll redraws once; harmless
    curPage.textContent = r.headers.get('X-Page');
    pageSel.value = r.headers.get('X-Page');
    if (label) {
      const note = r.headers.get('X-Consumed') === '0' ? '  (页面未处理该按键)' : '';
      log.textContent += `${++count}. ${label}${note}\n`;
      log.scrollTop = log.scrollHeight;
    }
  });
}
function press(name) { send('/key?name=' + name, name); }

// Browser microphone for the Voice and AI pages: records while UP is held (after the long press), 16 kHz mono WAV.
const mic = { ctx: null, stream: null, node: null, chunks: [] };
function beep(hz) {  // like the device's start/stop tone
  const c = new AudioContext(), o = c.createOscillator(), g = c.createGain();
  o.frequency.value = hz; g.gain.value = 0.1; o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime + 0.15); setTimeout(() => c.close(), 400);
}
async function micStart() {
  try {
    mic.chunks = [];
    mic.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mic.ctx = new AudioContext({ sampleRate: 16000 });
    const src = mic.ctx.createMediaStreamSource(mic.stream);
    mic.node = mic.ctx.createScriptProcessor(4096, 1, 1);
    mic.node.onaudioprocess = e => mic.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    src.connect(mic.node); mic.node.connect(mic.ctx.destination);
    document.getElementById('b-up').classList.add('rec'); beep(1200);
  } catch (e) { mic.stream = null; err.textContent = '麦克风不可用: ' + e.message + '（将使用静音）'; }
}
async function micStopAndUpload() {
  document.getElementById('b-up').classList.remove('rec');
  if (!mic.stream) return;
  beep(700);
  mic.node.disconnect(); mic.stream.getTracks().forEach(t => t.stop());
  const rate = mic.ctx.sampleRate; await mic.ctx.close(); mic.stream = null;
  let total = 0; for (const c of mic.chunks) total += c.length;
  const buf = new ArrayBuffer(44 + total * 2), v = new DataView(buf);
  const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + total * 2, true); str(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, total * 2, true);
  let o = 44;
  for (const c of mic.chunks) for (let i = 0; i < c.length; i++, o += 2) {
    v.setInt16(o, Math.max(-1, Math.min(1, c[i])) * 0x7fff, true);
  }
  await fetch('/voice', { method: 'POST', body: buf });
}

// The device refreshes its panel by itself when an answer arrives, but this page only draws on request: also re-read the
// screen every 2 s (queued behind key presses) and redraw when it changed. Needed after a spoken question.
let shownPng = null;
async function refreshIfChanged() {
  try {
    const r = await fetch('/screen?t=' + Date.now());
    if (!r.ok) return;
    const blob = await r.blob();
    const bytes = new Uint8Array(await blob.arrayBuffer());
    const key = bytes.length + ':' + bytes.reduce((h, b) => (h * 31 + b) | 0, 7);
    if (key === shownPng) return;
    shownPng = key;
    img.src = URL.createObjectURL(blob);
    curPage.textContent = r.headers.get('X-Page');
    pageSel.value = r.headers.get('X-Page');
  } catch (e) { /* the server may be restarting */ }
}
setInterval(() => { busy = busy.then(refreshIfChanged); }, 2000);

// Turns raw down/up edges of one physical button into click / long-press events.
const held = { up: false, down: false, boot: false };
let chordFired = false;
function makeButton(base, el) {
  let longTimer = null, longFired = false;
  function down() {
    if (held[base]) return;                       // ignore key auto-repeat
    held[base] = true; longFired = false; el.classList.add('down');
    if (!held.up || !held.down) chordFired = false;
    longTimer = setTimeout(() => {
      longTimer = null; longFired = true;
      if (base !== 'boot' && held.up && held.down) {   // UP+DOWN held together
        if (!chordFired) { chordFired = true; press('updownlong'); }
      } else if (!(base !== 'boot' && chordFired)) {
        press(base + 'long');
        if (base === 'up') micStart();
      }
    }, LONG_MS);
  }
  function up() {
    if (!held[base]) return;
    held[base] = false; el.classList.remove('down');
    if (longTimer !== null) {                     // released before the long-press threshold: a click
      clearTimeout(longTimer); longTimer = null;
      if (!chordFired) press(base);
    } else if (longFired && base === 'up' && !chordFired) {
      busy = busy.then(micStopAndUpload);          // the WAV must be on the server before the recording ends
      press('uplongrelease');                     // Voice app: releasing UP ends the recording
    }
  }
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); down(); });
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  return { down, up };
}

const buttons = {
  up: makeButton('up', document.getElementById('b-up')),
  down: makeButton('down', document.getElementById('b-down')),
  boot: makeButton('boot', document.getElementById('b-boot')),
};
const keyMap = { ArrowUp: 'up', ArrowDown: 'down', Enter: 'boot', b: 'boot', B: 'boot' };
addEventListener('keydown', e => {
  if (e.target === pageSel || !keyMap[e.key]) return;
  e.preventDefault(); buttons[keyMap[e.key]].down();
});
addEventListener('keyup', e => {
  if (!keyMap[e.key]) return;
  e.preventDefault(); buttons[keyMap[e.key]].up();
});

function resetLog() { log.textContent = ''; count = 0; }
pageSel.addEventListener('change', () => { const p = pageSel.value; pageSel.blur(); send('/jump?page=' + p, 'jump ' + p); });
document.getElementById('reset').addEventListener('click', e => { e.target.blur(); resetLog(); send('/reset'); });
fetch('/config').then(r => r.json()).then(c => {
  document.getElementById('devlink').href = `http://127.0.0.1:${c.device_port}/`;
  c.pages.forEach(p => pageSel.add(new Option(p, p)));
  send('/reset');
});
</script>
</body>
</html>
